name: tests

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ci-python
    steps:
      - uses: actions/checkout@v6
      - run: uv run --frozen --group dev pytest
      - run: uv run --frozen --group dev ruff check .
      - run: uv run --frozen --group dev ruff format --check .
